name: Desktop Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build desktop app
        continue-on-error: true
        run: npm run desktop:build:${{ matrix.target }}
      - name: Upload Windows artifacts
        if: matrix.target == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: theta-workplace-win
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: ignore
      - name: Upload Linux artifacts
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: theta-workplace-linux
          path: |
            release/*.AppImage
            release/*.blockmap
            release/latest-linux.yml
          if-no-files-found: ignore

  mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Android APK
        run: |
          npx cap sync android
        - name: Setup Android SDK
          uses: android-actions/setup-android@v3
        - name: Install Android SDK 36
          run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
          chmod +x android/gradlew
          android/gradlew --no-daemon assembleDebug
      - name: Find Android APK
        run: find android -type f -name '*.apk' -print
      - name: Upload Android artifact
        with:
          name: theta-workplace-android
          path: android/**/*.apk
            android/gradlew --no-daemon assembleDebug --stacktrace

  publish:
    needs: [build, mobile]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all available artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: List release assets
        run: mkdir -p release-assets; find release-assets -type f -maxdepth 2 -print
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: theta-workplace ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/**/*
          fail_on_unmatched_files: false
